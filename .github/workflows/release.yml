name: Build & Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Build single-file binaries with built-in csc.exe
        shell: cmd
        run: build.cmd

      - name: Generate previews, release archive & SHA-256 checksums
        shell: pwsh
        run: |
          $tag = if ($env:GITHUB_REF_TYPE -eq 'tag') { $env:GITHUB_REF_NAME } else { 'v2.1.0' }
          .\dist\MaicongCheck.exe --icons dist\icon_preview.png

          $zipPath = "dist\MaicongTray-$tag.zip"
          $stage = Join-Path $env:RUNNER_TEMP "maicong_stage"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item dist\MaicongTray.exe, dist\MaicongCheck.exe, dist\icon_preview.png, icon.ico, build.cmd, README.md, LICENSE $stage
          Copy-Item src (Join-Path $stage 'src') -Recurse
          Compress-Archive -Path "$stage\*" -DestinationPath $zipPath -Force

          $hashes = @('dist\MaicongTray.exe', 'dist\MaicongCheck.exe', $zipPath) | ForEach-Object {
              $h = (Get-FileHash -Algorithm SHA256 $_).Hash
              "$h  $(Split-Path $_ -Leaf)"
          }
          $hashes | Out-File -Encoding ascii dist\SHA256SUMS.txt
          Get-Content dist\SHA256SUMS.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: MaicongTray-Windows
          path: |
            dist/MaicongTray.exe
            dist/MaicongCheck.exe
            dist/MaicongTray-*.zip
            dist/SHA256SUMS.txt

      - name: Publish GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/MaicongTray.exe
            dist/MaicongCheck.exe
            dist/MaicongTray-*.zip
            dist/SHA256SUMS.txt
